services:
  postgres:
    container_name: ship-medusa-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=medusa-store
    networks:
      - medusa-network
    ports:
      - "5432:5432"
    volumes:
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: ship-medusa-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    hostname: redis
    networks:
      - medusa-network
    ports:
      - "6379:6379"
    volumes:
      - type: volume
        source: redis_data
        target: /data

networks:
  medusa-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
